name: Generate GGB File List

on:
  push:
    branches:
      - main
    paths:
      - 'ggbfiles/**'

  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate file list and inject into index.html
        run: |
          # 1. 递归查找 ggbfiles 下的所有 .ggb 文件
          # -type f: 仅匹配文件
          # -printf '%P\n': 去掉 'ggbfiles/' 前缀，保留相对路径（如 "folder/file.ggb"）
          FILES_JSON=$(find ggbfiles -type f -name "*.ggb" -printf '%P\n' \
            | sort \
            | jq -R . \
            | jq -s -c .)

          echo "Generated:"
          echo "$FILES_JSON"

          # 2. 替换 index.html 里的 GGB_FILES 变量
          sed -i \
            "s|const GGB_FILES = .*;|const GGB_FILES = $FILES_JSON;|g" \
            index.html

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add index.html

          git diff --staged --quiet || git commit -m "Update GGB file list [skip ci]"

          git push