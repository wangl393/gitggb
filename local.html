<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGB 一键预览与管理工具</title>
    <!-- 引入 GeoGebra 核心脚本 -->
    <script src="GeoGebra/deployggb.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* ==================== 模式 A：纯净嵌入模式 (替代原 at.html) ==================== */
        body.embed-mode {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #fff;
            display: block;
            padding: 0;
        }

        body.embed-mode .control-area,
        body.embed-mode .preview-area {
            display: none !important;
        }

        body.embed-mode #embed-container {
            width: 100%;
            height: 100%;
            display: block !important;
        }

        /* ==================== 模式 B：管理控制后台模式 ==================== */
        body:not(.embed-mode) {
            display: flex;
            height: 100vh;
            padding: 20px;
            gap: 20px;
            background: #fff;
        }

        body:not(.embed-mode) #embed-container {
            display: none !important;
        }

        .preview-area {
            flex: 1;
            border: 1px solid #ccc;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        #ggbApplet-control {
            width: 100%;
            height: 100%;
        }

        .control-area {
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 8px;
            background: #f9f9f9;
            height: 100%;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group.file-list-group {
            flex: 1;
            min-height: 0;
        }

        label {
            font-weight: 600;
            color: #333;
        }

        input,
        button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #0056b3;
        }

        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        #folder-select {
            background: #28a745;
        }

        #folder-select:hover {
            background: #218838;
        }

        .file-list-container {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
            padding: 8px;
        }

        .folder-block {
            margin-bottom: 12px;
        }

        .folder-block:last-child {
            margin-bottom: 0;
        }

        /* 文件夹标题样式与折叠交互 */
        .folder-title {
            font-weight: bold;
            font-size: 13px;
            color: #495057;
            padding: 6px 8px;
            background: #e9ecef;
            border-radius: 4px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }

        .folder-title:hover {
            background: #dee2e6;
        }

        .folder-title .arrow {
            transition: transform 0.2s ease;
            display: inline-block;
            font-size: 10px;
        }

        /* 文件夹内容包裹容器 */
        .folder-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
            margin-top: 2px;
        }

        /* 折叠状态样式 */
        .folder-block.collapsed .folder-content {
            display: none;
        }

        .folder-block.collapsed .folder-title .arrow {
            transform: rotate(-90deg);
        }

        .file-item {
            padding: 6px 10px;
            font-size: 13px;
            color: #333;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            word-break: break-all;
            transition: all 0.15s ease;
            margin-bottom: 2px;
        }

        .file-item:hover {
            background: #e7f3ff;
            color: #007bff;
        }

        .file-item.active {
            background: #007bff;
            color: white;
            font-weight: 500;
        }

        .empty-tip {
            color: #888;
            font-size: 13px;
            text-align: center;
            padding: 20px 0;
        }

        .tip {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        .error-tip {
            color: #dc3545;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <!-- 嵌入模式容器 -->
    <div id="embed-container"></div>

    <!-- 后台控制模式：左侧预览区 -->
    <div class="preview-area">
        <div id="ggbApplet-control"></div>
    </div>

    <!-- 后台控制模式：右侧控制区 -->
    <div class="control-area">
        <div class="control-group">
            <button id="folder-select">刷新文件列表</button>
            <div class="tip">
                自动递归扫描 <strong>ggbfiles</strong> 及其所有子文件夹
            </div>
            <div id="folder-error" class="tip error-tip" style="display:none;"></div>
        </div>

        <div class="control-group file-list-group">
            <label>文件列表 <span id="file-count" class="tip" style="font-weight: normal; margin-left: 5px;"></span></label>
            <div id="file-list-container" class="file-list-container">
                <div class="empty-tip">正在初始化...</div>
            </div>
        </div>

        <div class="control-group">
            <label for="width-input">宽度</label>
            <input type="number" id="width-input" value="819" min="100">
        </div>

        <div class="control-group">
            <label for="height-input">高度</label>
            <input type="number" id="height-input" value="590" min="100">
        </div>

        <button id="preview-btn" disabled>
            复制当前预览链接
        </button>
    </div>

    <script>
        // 通用 URL 参数获取
        function getQueryParam(param, defaultValue) {
            const urlParams = new URLSearchParams(window.location.search);
            const value = urlParams.get(param);
            if (value !== null && value.trim() !== "") {
                return value;
            }
            return defaultValue;
        }

        function getBasePath() {
            const path = window.location.pathname;
            const dir = path.substring(0, path.lastIndexOf('/') + 1);
            return window.location.origin + dir;
        }

        function encodeFilePath(path) {
            return path.split('/')
                .map(segment => encodeURIComponent(segment))
                .join('/');
        }

        // 检查当前访问是否携带 file 参数
        const fileParam = getQueryParam('file', null) || getQueryParam('filename', null);

        if (fileParam !== null) {
            // ==================== 模式 A 逻辑执行：纯净渲染播放器 ====================
            document.body.classList.add('embed-mode');

            let safePath = fileParam.replace(/\.\./g, '');
            if (safePath.startsWith('/')) safePath = safePath.substring(1);
            if (safePath.trim() === "") safePath = "shown.ggb";

            const fileUrl = "./ggbfiles/" + safePath;
            const width = parseInt(getQueryParam('width', 819), 10);
            const height = parseInt(getQueryParam('height', 590), 10);

            var parameters = {
                "id": "ggbApplet",
                "width": width,
                "height": height,
                "showMenuBar": false,
                "showAlgebraInput": false,
                "showToolBar": false,
                "customToolBar": "0 39 73 62 | 1 501 67 , 5 19 , 72 75 76 | 2 15 45 , 18 65 , 7 37 | 4 3 8 9 , 13 44 , 58 , 47 | 16 51 64 , 70 | 10 34 53 11 , 24  20 22 , 21 23 | 55 56 57 , 12 | 36 46 , 38 49  50 , 71  14  68 | 30 29 54 32 31 33 | 25 17 26 60 52 61 | 40 41 42 , 27 28 35 , 6",
                "showToolBarHelp": false,
                "showResetIcon": false,
                "enableLabelDrags": true,
                "enableShiftDragZoom": false,
                "enableRightClick": false,
                "errorDialogsActive": false,
                "useBrowserForJS": false,
                "allowStyleBar": false,
                "preventFocus": false,
                "showZoomButtons": false,
                "capturingThreshold": 3,
                "appletOnLoad": function (api) { },
                "showFullscreenButton": false,
                "scale": 1,
                "disableAutoScale": false,
                "allowUpscale": false,
                "clickToLoad": false,
                "appName": "classic",
                "buttonRounding": 0.7,
                "buttonShadows": false,
                "language": "en",
                "filename": fileUrl,
            };

            var views = { 'is3D': 1, 'AV': 0, 'SV': 0, 'CV': 0, 'EV2': 0, 'CP': 0, 'PC': 0, 'DA': 0, 'FI': 0, 'macro': 0 };
            var applet = new GGBApplet(parameters, '5.0', views);
            applet.setHTML5Codebase('GeoGebra/HTML5/5.0/web3d/');
            window.onload = function () { applet.inject('embed-container'); };

        } else {
            // ==================== 模式 B 逻辑执行：后台管理工具 ====================
            const widthInput = document.getElementById('width-input');
            const heightInput = document.getElementById('height-input');
            const previewBtn = document.getElementById('preview-btn');
            const fileCount = document.getElementById('file-count');
            const folderError = document.getElementById('folder-error');
            const folderSelectBtn = document.getElementById('folder-select');
            const fileListContainer = document.getElementById('file-list-container');

            let currentSelectedPath = '';

            folderSelectBtn.onclick = loadGgbFiles;
            window.addEventListener('DOMContentLoaded', loadGgbFiles);

            async function scanDirectory() {
                const visited = new Set();
                const allFiles = [];
                const rootDirUrl = new URL('ggbfiles/', window.location.href);
                const rootDirPathName = decodeURIComponent(rootDirUrl.pathname);

                async function crawl(currentUrl) {
                    const urlString = currentUrl.origin + currentUrl.pathname;
                    if (visited.has(urlString)) return;
                    visited.add(urlString);

                    try {
                        const response = await fetch(currentUrl.href);
                        if (!response.ok) return;

                        const htmlText = await response.text();
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(htmlText, 'text/html');
                        const links = doc.querySelectorAll('a');

                        for (const link of links) {
                            const rawHref = link.getAttribute('href');
                            if (!rawHref || rawHref.startsWith('#') || rawHref.startsWith('javascript:')) continue;

                            let absoluteUrl;
                            try {
                                absoluteUrl = new URL(rawHref, currentUrl);
                            } catch (e) {
                                continue;
                            }

                            if (absoluteUrl.origin !== window.location.origin) continue;
                            if (!absoluteUrl.pathname.startsWith(rootDirUrl.pathname)) continue;

                            const pathName = decodeURIComponent(absoluteUrl.pathname);

                            if (pathName.toLowerCase().endsWith('.ggb')) {
                                const relativePath = pathName.substring(rootDirPathName.length);
                                const pathParts = relativePath.split('/').filter(Boolean);
                                const fileName = pathParts.pop();
                                const folderPath = pathParts.join('/') || '根目录 (ggbfiles)';

                                allFiles.push({
                                    fileName: fileName,
                                    filePath: relativePath,
                                    folder: folderPath
                                });
                            } else {
                                const isDir = rawHref.endsWith('/') ||
                                    link.textContent.trim().endsWith('/') ||
                                    !pathName.split('/').pop().includes('.');

                                if (isDir && absoluteUrl.pathname.startsWith(currentUrl.pathname) && absoluteUrl.pathname !== currentUrl.pathname) {
                                    const subDirUrl = new URL(absoluteUrl.pathname.endsWith('/') ? absoluteUrl.pathname : absoluteUrl.pathname + '/', absoluteUrl.origin);
                                    await crawl(subDirUrl);
                                }
                            }
                        }
                    } catch (e) {
                        console.error('扫描目录出错:', currentUrl.href, e);
                    }
                }

                await crawl(rootDirUrl);
                return allFiles;
            }

            async function loadGgbFiles() {
                fileListContainer.innerHTML = '<div class="empty-tip">正在扫描文件夹...</div>';
                previewBtn.disabled = true;
                folderError.style.display = 'none';

                try {
                    const rawFiles = await scanDirectory();
                    const uniqueFiles = [];
                    const seen = new Set();
                    for (const file of rawFiles) {
                        if (!seen.has(file.filePath)) {
                            seen.add(file.filePath);
                            uniqueFiles.push(file);
                        }
                    }
                    updateFileListView(uniqueFiles);
                } catch (error) {
                    fileListContainer.innerHTML = '<div class="empty-tip">加载失败</div>';
                    folderError.textContent = '无法自动读取，请检查 Live Server 环境';
                    folderError.style.display = 'block';
                }
            }

            function updateFileListView(files) {
                fileListContainer.innerHTML = '';

                if (!files || files.length === 0) {
                    fileListContainer.innerHTML = '<div class="empty-tip">ggbfiles 及其子文件夹中未找到 .ggb 文件</div>';
                    fileCount.textContent = '(共 0 个文件)';
                    previewBtn.disabled = true;
                    return;
                }

                const grouped = {};
                files.forEach(file => {
                    const folderKey = file.folder;
                    if (!grouped[folderKey]) grouped[folderKey] = [];
                    grouped[folderKey].push(file);
                });

                const folderKeys = Object.keys(grouped).sort((a, b) => {
                    if (a.startsWith('根目录')) return -1;
                    if (b.startsWith('根目录')) return 1;
                    return a.localeCompare(b, 'zh-Hans-CN', { sensitivity: 'accent' });
                });

                let totalFilesCount = 0;
                let firstFileItem = null;

                folderKeys.forEach(folderName => {
                    const folderFiles = grouped[folderName];
                    totalFilesCount += folderFiles.length;
                    folderFiles.sort((a, b) => a.fileName.localeCompare(b.fileName, 'zh-Hans-CN', { sensitivity: 'accent' }));

                    const folderBlock = document.createElement('div');
                    folderBlock.className = 'folder-block';

                    // 文件夹标题栏（含折叠箭头和图标）
                    const folderTitle = document.createElement('div');
                    folderTitle.className = 'folder-title';
                    folderTitle.innerHTML = `<span class="arrow">▼</span> 📁 ${folderName}`;

                    // 文件夹内容包裹容器
                    const folderContent = document.createElement('div');
                    folderContent.className = 'folder-content';

                    // 绑定点击折叠/展开事件
                    folderTitle.addEventListener('click', () => {
                        folderBlock.classList.toggle('collapsed');
                    });

                    folderBlock.appendChild(folderTitle);

                    folderFiles.forEach(file => {
                        const fileItem = document.createElement('div');
                        fileItem.className = 'file-item';
                        fileItem.dataset.path = file.filePath;
                        fileItem.innerHTML = `📄 ${file.fileName}`;

                        fileItem.addEventListener('click', () => {
                            selectFile(fileItem, file.filePath);
                        });

                        folderContent.appendChild(fileItem);

                        if (!firstFileItem) {
                            firstFileItem = { element: fileItem, path: file.filePath };
                        }
                    });

                    folderBlock.appendChild(folderContent);
                    fileListContainer.appendChild(folderBlock);
                });

                fileCount.textContent = `(共 ${totalFilesCount} 个文件)`;
                previewBtn.disabled = false;

                if (firstFileItem) {
                    selectFile(firstFileItem.element, firstFileItem.path);
                }
            }

            function selectFile(element, filePath) {
                const allItems = document.querySelectorAll('.file-item');
                allItems.forEach(item => item.classList.remove('active'));
                element.classList.add('active');
                currentSelectedPath = filePath;
                renderPreview();
            }

            function renderPreview() {
                if (!currentSelectedPath) return;
                const width = parseInt(widthInput.value, 10) || 819;
                const height = parseInt(heightInput.value, 10) || 590;

                const container = document.getElementById('ggbApplet-control');
                container.innerHTML = '';

                const fileUrl = "./ggbfiles/" + currentSelectedPath;

                var parameters = {
                    "id": "ggbApplet",
                    "width": width,
                    "height": height,
                    "showMenuBar": false,
                    "showAlgebraInput": false,
                    "showToolBar": false,
                    "customToolBar": "0 39 73 62 | 1 501 67 , 5 19 , 72 75 76 | 2 15 45 , 18 65 , 7 37 | 4 3 8 9 , 13 44 , 58 , 47 | 16 51 64 , 70 | 10 34 53 11 , 24  20 22 , 21 23 | 55 56 57 , 12 | 36 46 , 38 49  50 , 71  14  68 | 30 29 54 32 31 33 | 25 17 26 60 52 61 | 40 41 42 , 27 28 35 , 6",
                    "showToolBarHelp": false,
                    "showResetIcon": false,
                    "enableLabelDrags": true,
                    "enableShiftDragZoom": false,
                    "enableRightClick": false,
                    "errorDialogsActive": false,
                    "useBrowserForJS": false,
                    "allowStyleBar": false,
                    "preventFocus": false,
                    "showZoomButtons": false,
                    "capturingThreshold": 3,
                    "appletOnLoad": function (api) { },
                    "showFullscreenButton": false,
                    "scale": 1,
                    "disableAutoScale": false,
                    "allowUpscale": false,
                    "clickToLoad": false,
                    "appName": "classic",
                    "buttonRounding": 0.7,
                    "buttonShadows": false,
                    "language": "en",
                    "filename": fileUrl,
                };

                var views = { 'is3D': 1, 'AV': 0, 'SV': 0, 'CV': 0, 'EV2': 0, 'CP': 0, 'PC': 0, 'DA': 0, 'FI': 0, 'macro': 0 };
                var applet = new GGBApplet(parameters, '5.0', views);
                applet.setHTML5Codebase('GeoGebra/HTML5/5.0/web3d/');
                applet.inject('ggbApplet-control');

                // 自动生成并复制 iframe 代码
                const base = getBasePath();
                const encodedPath = encodeFilePath(currentSelectedPath);
                const previewUrl = `${base}?file=${encodedPath}&width=${width}&height=${height}`;
                const iframeHtml = `<iframe src="${previewUrl}" width="${width}px" height="${height}px" style="border:0px;"></iframe>`;

                navigator.clipboard.writeText(iframeHtml).catch(err => console.error('复制失败:', err));
            }

            widthInput.addEventListener('input', renderPreview);
            heightInput.addEventListener('input', renderPreview);
            previewBtn.addEventListener('click', renderPreview);
        }
    </script>
</body>

</html>
